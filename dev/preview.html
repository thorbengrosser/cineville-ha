<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cineville card preview</title>
  <!--
    Renders the real card file with a mock `hass` that answers cineville.get_program from
    dev/fixtures/program-hamburg.json. Serve the repo root (python3 -m http.server) and open /dev/preview.html.
    Query params: ?theme=dark  &lang=en  &width=380  &view=list  &height=400  &max_height=400
                  &login=0 (not logged in)  &people=2  &time_format=12|24|language|system  &date_format=DMY|MDY|YMD  &time_zone=server
  -->
  <style>
    :root {
      --primary-color: #03a9f4; --rgb-primary-color: 3, 169, 244; --accent-color: #ff9800;
      --primary-text-color: #212121; --secondary-text-color: #727272; --text-primary-color: #fff;
      --card-background-color: #fff; --secondary-background-color: #f0f0f0; --divider-color: rgba(0,0,0,.12);
      --error-color: #db4437; --primary-background-color: #fafafa;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }
    :root.dark {
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
      --secondary-background-color: #282828; --divider-color: rgba(225,225,225,.12); --primary-background-color: #111;
    }
    body { margin: 0; padding: 16px; background: var(--primary-background-color); }
    .wrap { max-width: var(--w, 520px); margin: 0 auto; }
    .controls { font: 13px system-ui; color: var(--secondary-text-color); margin-bottom: 12px; }
    .controls a { color: var(--primary-color); margin-right: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls" id="controls"></div>
    <cineville-card id="card"></cineville-card>
  </div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    if (params.get("theme") === "dark") document.documentElement.classList.add("dark");
    if (params.get("width")) document.documentElement.style.setProperty("--w", `${params.get("width")}px`);

    // Minimal stand-ins for HA's own elements
    customElements.define("ha-card", class extends HTMLElement {
      connectedCallback() {
        // Like HA's ha-card: no inline display, so the card's own CSS (display: flex) applies
        Object.assign(this.style, { background: "var(--card-background-color)", borderRadius: "12px",
          border: "1px solid var(--divider-color)", color: "var(--primary-text-color)" });
      }
    });
    const GLYPHS = { "mdi:view-agenda-outline": "▤", "mdi:format-list-bulleted": "☰", "mdi:filmstrip": "🎞",
      "mdi:bookmark": "★", "mdi:bookmark-outline": "☆" };
    customElements.define("ha-icon", class extends HTMLElement {
      connectedCallback() { this.textContent = GLYPHS[this.getAttribute("icon")] || "•"; }
    });

    const recorded = await (await fetch("fixtures/program-hamburg.json")).json();
    // Shift the recorded days so the first one is today's Cineville day (Berlin, day starts 04:00)
    const today = new Date(Date.now() - 4 * 3600 * 1000).toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });
    const offsetMs = Date.parse(`${today}T00:00:00Z`) - Date.parse(`${Object.keys(recorded)[0]}T00:00:00Z`);
    const shiftDay = (d) => new Date(Date.parse(`${d}T00:00:00Z`) + offsetMs).toISOString().slice(0, 10);
    const shiftTime = (iso) => (iso ? new Date(Date.parse(iso) + offsetMs).toISOString() : iso);
    const fixture = {};
    for (const [day, program] of Object.entries(recorded)) {
      for (const s of program.showtimes) Object.assign(s, { start: shiftTime(s.start), end: shiftTime(s.end) });
      fixture[shiftDay(day)] = { ...program, day: shiftDay(day), today };
    }

    // Simulate logged-in accounts (?people=2 for two): mark films as on watchlists / seen, deterministically
    const loggedIn = params.get("login") !== "0";
    const people = loggedIn
      ? [{ id: "u1", name: "Thorben" }, { id: "u2", name: "Anna" }].slice(0, Number(params.get("people") || 1))
      : [];
    const filmIds = [...new Set(Object.values(fixture).flatMap((p) => p.showtimes.map((s) => s.film.id)))].sort();
    for (const program of Object.values(fixture)) {
      program.logged_in = loggedIn;
      program.accounts = people;
      for (const show of program.showtimes) {
        const i = filmIds.indexOf(show.film.id);
        const wants = { u1: i % 4 === 0, u2: i % 3 === 0 };
        const saw = { u1: i % 6 === 1, u2: i % 5 === 1 || i % 6 === 1 };
        show.film.watchlist_by = people.filter((p) => wants[p.id]).map((p) => p.id);
        show.film.seen_by = people.filter((p) => saw[p.id]).map((p) => p.id);
        show.film.on_watchlist = show.film.watchlist_by.length > 0;
        show.film.seen = people.length > 0 && show.film.seen_by.length === people.length;
      }
    }

    const hass = {
      locale: {
        language: params.get("lang") || "de",
        time_format: params.get("time_format") || "language",
        date_format: params.get("date_format") || "language",
        time_zone: params.get("time_zone") || "local",
      },
      config: { time_zone: "America/New_York" }, // so ?time_zone=server visibly differs
      connection: {
        async sendMessagePromise(msg) {
          await new Promise((r) => setTimeout(r, 300)); // simulate latency
          const day = msg.service_data.date || today;
          if (!fixture[day]) throw new Error(`No fixture for ${day} (preview only has ${Object.keys(fixture).join(", ")})`);
          return { response: fixture[day] };
        },
      },
    };

    await import("../custom_components/cineville/frontend/cineville-card.js");
    const card = document.getElementById("card");
    // ?height=400 simulates a sections-dashboard grid cell; ?max_height=400 tests the masonry option
    if (params.get("height")) card.style.height = `${params.get("height")}px`;
    card.setConfig({ view: params.get("view") || "films", ...(params.get("max_height") ? { max_height: params.get("max_height") } : {}) });
    card.hass = hass;

    const link = (label, changes) => {
      const p = new URLSearchParams(location.search);
      Object.entries(changes).forEach(([k, v]) => (v === null ? p.delete(k) : p.set(k, v)));
      return `<a href="?${p}">${label}</a>`;
    };
    document.getElementById("controls").innerHTML = `Preview (fixture ${today}): ` +
      link("light", { theme: null }) + link("dark", { theme: "dark" }) +
      link("de", { lang: "de" }) + link("en", { lang: "en" }) +
      link("phone 380px", { width: 380 }) + link("wide", { width: null }) +
      link("logged out", { login: "0" }) + link("1 person", { login: null, people: null }) + link("2 people", { login: null, people: "2" }) +
      link("12h", { time_format: "12" }) + link("24h", { time_format: null });
  </script>
</body>
</html>
